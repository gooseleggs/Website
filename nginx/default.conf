server {
    listen 80;
    root /usr/share/nginx/html;
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.(avif|css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
}
